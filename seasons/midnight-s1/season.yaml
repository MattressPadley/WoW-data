name: Midnight Season 1
slug: midnight-s1
expansion: Midnight
patch: "12.0"

tracks:
  adventurer:
    min_ilvl: 220
    max_ilvl: 237
    ranks: 6
    crest: Adventurer Dawncrest
    sources:
      - Normal Seasonal Dungeons
      - Normal Prey Hunts
      - Delves Tiers 1-4
      - Outdoor Events
  veteran:
    min_ilvl: 233
    max_ilvl: 250
    ranks: 6
    crest: Veteran Dawncrest
    sources:
      - Raid Finder
      - Heroic Seasonal Dungeons
      - Hard Prey Hunts
      - Delves Tiers 5-6
      - Trovehunter's Bounty Tiers 4-5
  champion:
    min_ilvl: 246
    max_ilvl: 263
    ranks: 6
    crest: Champion Dawncrest
    sources:
      - Normal Raid
      - Mythic +2-3 Dungeons
      - Mythic Seasonal Dungeons
      - Nightmare Prey Hunts
      - Delves Tiers 7-8
      - Trovehunter's Bounty Tiers 6-7
  hero:
    min_ilvl: 259
    max_ilvl: 276
    ranks: 6
    crest: Hero Dawncrest
    sources:
      - Heroic Raid
      - Mythic +4-8 Dungeons
      - Heroic Great Vault
      - Delves Tier 11
  myth:
    min_ilvl: 272
    max_ilvl: 289
    ranks: 6
    crest: Myth Dawncrest
    sources:
      - Mythic Raid
      - Mythic +9 and Higher
      - Mythic Great Vault

# Crest acquisition sources (drives the seasonal-info crest legend panel).
# Independent from track.sources because some activities award a crest tier
# different from the gear ilvl tier they drop.
crest_sources:
  Myth Dawncrest:
    - Mythic +9 and Higher
    - Mythic Raid Bosses
  Hero Dawncrest:
    - Mythic +4-8 Dungeons
    - Heroic Raid Bosses
    - Delves Tier 11
    - Trovehunter's Bounty Tiers 8+
  Champion Dawncrest:
    - Mythic +2-3 Dungeons
    - Mythic Seasonal Dungeons
    - Normal Raid Bosses
    - Nightmare Prey Hunts
    - Delves Tiers 7-8
    - Trovehunter's Bounty Tiers 6-7
  Veteran Dawncrest:
    - Heroic Seasonal Dungeons
    - Raid Finder Bosses
    - Hard Prey Hunts
    - Delves Tiers 5-6
    - Trovehunter's Bounty Tiers 4-5
  Adventurer Dawncrest:
    - Outdoor Events
    - Normal Prey Hunts
    - Delves Tiers 1-4

track_ranks:
  adventurer: [220, 224, 227, 230, 233, 237]
  veteran:    [233, 237, 240, 243, 246, 250]
  champion:   [246, 250, 253, 256, 259, 263]
  hero:       [259, 263, 266, 269, 272, 276]
  myth:       [272, 276, 279, 282, 285, 289]

raid_difficulty_track:
  lfr: veteran
  normal: champion
  heroic: hero
  mythic: myth

# Boss position in encounter list -> starting rank (1-indexed)
# Boss 1 = rank 1, Boss 2-3 = rank 2, Boss 4-5 = rank 3, Boss 6 = rank 4, rare/last = rank 6
boss_rank_rules:
  - positions: [1]
    rank: 1
  - positions: [2, 3]
    rank: 2
  - positions: [4, 5]
    rank: 3
  - positions: [6]
    rank: 4
  - positions: [7, 8, 9, 10]
    rank: 6

crest_suffix: Dawncrest

# Tier token prefix → armor type (for class-filtered loot)
tier_token_prefixes:
  Voidforged: Plate
  Voidcast: Mail
  Voidcured: Leather
  Voidwoven: Cloth
  Alnforged: Plate
  Alncast: Mail
  Alncured: Leather
  Alnwoven: Cloth

# M+ keystone rotation (journal instance IDs) — 8 dungeons per season
# M+ keystone rotation (journal instance IDs) — 8 dungeons per season
# min_item_id: filters out legacy loot pool items below this ID (old expansions only)
keystone_dungeons:
  - { id: 1300, name: "Magisters' Terrace" }         # Midnight
  - { id: 1315, name: "Maisara Caverns" }             # Midnight
  - { id: 1316, name: "Nexus-Point Xenas" }           # Midnight
  - { id: 1299, name: "Windrunner Spire" }             # Midnight
  - { id: 1201, name: "Algeth'ar Academy" }            # Dragonflight
  - { id: 278,  name: "Pit of Saron", min_item_id: 133000 }        # Wrath
  - { id: 945,  name: "Seat of the Triumvirate" }     # Legion
  - { id: 476,  name: "Skyreach", min_item_id: 250000 }            # WoD

# --- Dungeon & M+ loot tables ---

dungeon_difficulty_track:
  heroic: { track: adventurer, rank: 4 }     # ilvl 230
  mythic: { track: champion, rank: 1 }       # ilvl 246 (M0)

# End-of-dungeon Challenger's Cache ilvl (caps at +10)
